# Active config: trading US/EU stocks and ETFs on Trading 212 (Invest or
# Stocks ISA account only - CFD and SIPP accounts are not supported by the
# public API). See config/config.trading212.example.yaml for the annotated
# template this was copied from, and config/config.example.yaml for the
# crypto/ccxt equivalent.
#
# t212_environment is "live" here because this account's API key was
# generated against the real account, not a separate demo account - confirmed
# working via `python -m trading_bot.main check-broker` on 2026-08-14.

exchange:
  provider: trading212
  symbol: AAPL              # Yahoo Finance ticker - used for price data (EMA/RSI/ATR)
  data_symbol: AAPL          # optional: only set if it differs from `symbol`
  t212_ticker: AAPL_US_EQ    # Trading 212 instrument code - used for order placement
  t212_environment: live     # "demo" (T212's own paper trading, no real money) or "live"
  timeframe: 15m              # day trading: 15-minute bars (Yahoo Finance only keeps ~60 days of this resolution for backtesting - doesn't affect live/paper running indefinitely)

strategy:
  ema_fast: 8               # shorter periods = more frequent (and noisier/weaker) crossover signals
  ema_slow: 18
  rsi_period: 14
  rsi_overbought: 85        # was 70 - lets more crossovers count as buys instead of being filtered out
  rsi_oversold: 30
  atr_period: 14
  atr_stop_mult: 2.0
  atr_target_mult: 3.0

risk:
  risk_per_trade_pct: 100.0  # explicitly requested - risks the entire balance on a single stop-loss hit; effectively no risk control
  max_daily_loss_pct: 5.0
  max_open_positions: 1
  min_order_quote: 1.0    # lowered for testing with a small balance - raise this back up before trading seriously
  taker_fee_pct: 0.0       # T212 is commission-free on Invest/ISA trades

runtime:
  poll_interval_seconds: 300    # every 5 min - day trading needs to react faster than the hourly check used for daily bars
  dry_run: true                  # keep true until check-broker succeeds and you've paper traded
  state_dir: state
  stop_file: STOP

session:
  enabled: true                   # force-close any open position before the market closes - avoids overnight gap risk
  timezone: America/New_York      # AAPL trades on NASDAQ/NYSE, both on US Eastern time
  close_time: "16:00"              # US market close
  close_buffer_minutes: 15         # exit 15 min early so the closing order has time to fill
