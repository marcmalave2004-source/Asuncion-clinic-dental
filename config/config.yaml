# Active config: trading US/EU stocks and ETFs on Trading 212 (Invest or
# Stocks ISA account only - CFD and SIPP accounts are not supported by the
# public API). See config/config.trading212.example.yaml for the annotated
# template this was copied from, and config/config.example.yaml for the
# crypto/ccxt equivalent.
#
# t212_environment is "live" here because this account's API key was
# generated against the real account, not a separate demo account - confirmed
# working via `python -m trading_bot.main check-broker` on 2026-08-14.

exchange:
  provider: trading212
  symbol: AAPL              # Yahoo Finance ticker - used for price data (EMA/RSI/ATR)
  data_symbol: AAPL          # optional: only set if it differs from `symbol`
  t212_ticker: AAPL_US_EQ    # Trading 212 instrument code - used for order placement
  t212_environment: live     # "demo" (T212's own paper trading, no real money) or "live"
  timeframe: 1d               # daily bars - T212/Yahoo intraday history is limited (see README)

strategy:
  ema_fast: 12
  ema_slow: 26
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  atr_period: 14
  atr_stop_mult: 2.0
  atr_target_mult: 3.0

risk:
  risk_per_trade_pct: 1.0
  max_daily_loss_pct: 5.0
  max_open_positions: 1
  min_order_quote: 1.0    # lowered for testing with a small balance - raise this back up before trading seriously
  taker_fee_pct: 0.0       # T212 is commission-free on Invest/ISA trades

runtime:
  poll_interval_seconds: 3600   # hourly is plenty for a daily-bar strategy
  dry_run: true                  # keep true until check-broker succeeds and you've paper traded
  state_dir: state
  stop_file: STOP
