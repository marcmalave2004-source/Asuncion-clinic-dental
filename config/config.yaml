exchange:
  id: binance
  market_type: spot
  symbol: BTC/USDT
  timeframe: 1h
  use_testnet: true

strategy:
  ema_fast: 12
  ema_slow: 26
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  atr_period: 14
  atr_stop_mult: 2.0
  atr_target_mult: 3.0

risk:
  risk_per_trade_pct: 1.0
  max_daily_loss_pct: 5.0
  max_open_positions: 1
  min_order_quote: 10.0
  taker_fee_pct: 0.1

runtime:
  poll_interval_seconds: 60
  dry_run: true
  state_dir: state
  stop_file: STOP
