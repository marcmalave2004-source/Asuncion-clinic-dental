# Example config for trading US/EU stocks and ETFs on Trading 212 (Invest or
# Stocks ISA account only - CFD and SIPP accounts are not supported by the
# public API). Copy to config/config.yaml to use it.
#
# Run `python -m trading_bot.main check-broker` first to confirm your API
# key authenticates and to see the raw account summary response - the exact
# field name for free cash isn't documented with a literal example, so
# broker.py guesses from a few plausible names (see README > Trading 212).

exchange:
  provider: trading212
  symbol: AAPL              # Yahoo Finance ticker - used for price data (EMA/RSI/ATR)
  data_symbol: AAPL          # optional: only set if it differs from `symbol`
  t212_ticker: AAPL_US_EQ    # Trading 212 instrument code - used for order placement
  t212_environment: demo     # "demo" (T212's own paper trading, no real money) or "live"
  timeframe: 1d               # daily bars - T212/Yahoo intraday history is limited (see README)

strategy:
  ema_fast: 12
  ema_slow: 26
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  atr_period: 14
  atr_stop_mult: 2.0
  atr_target_mult: 3.0

risk:
  risk_per_trade_pct: 1.0
  max_daily_loss_pct: 5.0
  max_open_positions: 1
  min_order_quote: 10.0   # T212 supports fractional shares, so this can be small
  taker_fee_pct: 0.0       # T212 is commission-free on Invest/ISA trades

runtime:
  poll_interval_seconds: 3600   # hourly is plenty for a daily-bar strategy
  dry_run: true                  # keep true until check-broker succeeds and you've paper traded
  state_dir: state
  stop_file: STOP

session:
  enabled: false   # only useful for intraday/day trading (see below) - irrelevant for this daily-bar swing setup
  # For day trading: set timeframe above to something intraday (e.g. "15m"),
  # lower poll_interval_seconds (e.g. 300), and enable this block so open
  # positions get force-closed before the market shuts, instead of holding
  # overnight where a stop-loss can't protect against a gap:
  #   enabled: true
  #   timezone: America/New_York   # AAPL/most US tickers trade on this timezone
  #   close_time: "16:00"
  #   close_buffer_minutes: 15
